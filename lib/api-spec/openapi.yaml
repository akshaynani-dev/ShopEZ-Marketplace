openapi: 3.1.0
info:
  title: ShopEZ Trade
  version: 1.0.0
  description: Stock trading platform API

servers:
  - url: /api

tags:
  - name: health
  - name: auth
  - name: stocks
  - name: trading
  - name: portfolio
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
        "409":
          description: Email already exists

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /stocks:
    get:
      tags: [stocks]
      operationId: getStocks
      summary: List all stocks
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: sector
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, change_asc, change_desc, name_asc]
      responses:
        "200":
          description: Stock list
          content:
            application/json:
              schema:
                type: object
                properties:
                  stocks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stock"
                  sectors:
                    type: array
                    items:
                      type: string
                required: [stocks, sectors]

  /stocks/movers:
    get:
      tags: [stocks]
      operationId: getMovers
      summary: Get top gainers and losers
      responses:
        "200":
          description: Market movers
          content:
            application/json:
              schema:
                type: object
                properties:
                  gainers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stock"
                  losers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stock"
                required: [gainers, losers]

  /stocks/{symbol}:
    get:
      tags: [stocks]
      operationId: getStock
      summary: Get stock details
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
        "404":
          description: Not found

  /trade/buy:
    post:
      tags: [trading]
      operationId: buyStock
      summary: Buy shares of a stock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "200":
          description: Trade executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResult"
        "400":
          description: Insufficient funds or invalid input
        "404":
          description: Stock not found

  /trade/sell:
    post:
      tags: [trading]
      operationId: sellStock
      summary: Sell shares of a stock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "200":
          description: Trade executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResult"
        "400":
          description: Insufficient shares or invalid input
        "404":
          description: Stock not found

  /portfolio:
    get:
      tags: [portfolio]
      operationId: getPortfolio
      summary: Get user portfolio
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portfolio data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /portfolio/transactions:
    get:
      tags: [portfolio]
      operationId: getTransactions
      summary: Get user transaction history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /admin/users:
    get:
      tags: [admin]
      operationId: adminGetUsers
      summary: List all users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{userId}/balance:
    patch:
      tags: [admin]
      operationId: adminUpdateBalance
      summary: Update user virtual balance
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                virtualBalance:
                  type: number
              required: [virtualBalance]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/stocks:
    get:
      tags: [admin]
      operationId: adminGetStocks
      summary: List all stocks (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stocks list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stock"
    post:
      tags: [admin]
      operationId: adminCreateStock
      summary: Create a new stock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockInput"
      responses:
        "201":
          description: Stock created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"

  /admin/stocks/{symbol}:
    patch:
      tags: [admin]
      operationId: adminUpdateStock
      summary: Update a stock
      security:
        - bearerAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockInput"
      responses:
        "200":
          description: Updated stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
    delete:
      tags: [admin]
      operationId: adminDeleteStock
      summary: Delete a stock
      security:
        - bearerAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/transactions:
    get:
      tags: [admin]
      operationId: adminGetTransactions
      summary: All transactions (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /admin/seed:
    post:
      tags: [admin]
      operationId: adminSeed
      summary: Seed stock and user data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Seeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: number
                required: [message, count]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        virtualBalance:
          type: number
        createdAt:
          type: string
      required: [id, name, email, role, virtualBalance, createdAt]

    RegisterInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [user, admin]
      required: [name, email, password]

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    HistoricalPoint:
      type: object
      properties:
        date:
          type: string
        price:
          type: number
      required: [date, price]

    Stock:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        previousClose:
          type: number
        change:
          type: number
        changePercent:
          type: number
        volume:
          type: number
        marketCap:
          type: number
        sector:
          type: string
        description:
          type: string
        historicalData:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalPoint"
      required: [symbol, name, price, previousClose, change, changePercent, volume, marketCap, sector, description, historicalData]

    StockInput:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        previousClose:
          type: number
        sector:
          type: string
        description:
          type: string
        volume:
          type: number
        marketCap:
          type: number
      required: [symbol, name, price, previousClose, sector]

    TradeInput:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          type: number
      required: [symbol, quantity]

    TradeResult:
      type: object
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"
        newBalance:
          type: number
      required: [transaction, newBalance]

    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        symbol:
          type: string
        stockName:
          type: string
        type:
          type: string
          enum: [buy, sell]
        quantity:
          type: number
        price:
          type: number
        total:
          type: number
        createdAt:
          type: string
      required: [id, userId, symbol, stockName, type, quantity, price, total, createdAt]

    Holding:
      type: object
      properties:
        symbol:
          type: string
        stockName:
          type: string
        quantity:
          type: number
        avgBuyPrice:
          type: number
        currentPrice:
          type: number
        currentValue:
          type: number
        profitLoss:
          type: number
        profitLossPercent:
          type: number
      required: [symbol, stockName, quantity, avgBuyPrice, currentPrice, currentValue, profitLoss, profitLossPercent]

    Portfolio:
      type: object
      properties:
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/Holding"
        totalValue:
          type: number
        totalInvested:
          type: number
        totalProfitLoss:
          type: number
        totalProfitLossPercent:
          type: number
        cashBalance:
          type: number
      required: [holdings, totalValue, totalInvested, totalProfitLoss, totalProfitLossPercent, cashBalance]
